name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "dev/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build, test, package, and validate
        timeout-minutes: 25
        shell: pwsh
        run: >-
          ./build.ps1
          -Task CI
          -Configuration Release
          -BuildNumber ${{ github.run_number }}
          -CommitSha ${{ github.sha }}

      - name: Upload package
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: pscx-${{ github.run_number }}
          path: artifacts/packages/*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: artifacts/test-results/**
          if-no-files-found: warn
          retention-days: 14
