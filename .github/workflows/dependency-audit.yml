name: Dependency audit

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore and report vulnerable direct and transitive packages
        shell: pwsh
        run: ./build.ps1 -Task Audit

      - name: Check redistributed third-party releases
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          ./Tools/Test-PscxRedistributedBinary.ps1
          -CheckUpdates
          -FailWhenUpdateAvailable
          -ResultsPath artifacts/test-results/Pscx.ThirdPartyUpdates.json

      - name: Upload third-party update report
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v7
        with:
          name: third-party-update-report
          path: artifacts/test-results/Pscx.ThirdPartyUpdates.json
          if-no-files-found: warn
          retention-days: 30
