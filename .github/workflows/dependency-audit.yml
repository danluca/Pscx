name: Dependency audit

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore and report vulnerable direct and transitive packages
        shell: pwsh
        run: ./build.ps1 -Task Audit
